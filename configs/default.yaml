camera:
  index: 0
  width: 640
  height: 480
  fps: 30
  source: ""
  retry_attempts: 3
  retry_delay_sec: 1.0

weights:
  ear: 0.40
  mar: 0.10
  head_pose: 0.15
  perclos: 0.30
  blink_rate: 0.05
  yolo_eye: 0.35

ear:
  threshold: 0.26
  consecutive_frames: 5

mar:
  threshold: 0.75
  min_duration_sec: 1.5

head_pose:
  pitch_threshold: -15.0
  yaw_threshold: 30.0

perclos:
  window_sec: 30.0
  threshold: 0.15

blink_rate:
  normal_low: 8
  normal_high: 25
  window_sec: 60.0

state_machine:
  warning_threshold: 0.45
  distracted_threshold: 0.65
  safe_threshold: 0.25
  warning_sustain_sec: 1.0
  distracted_sustain_sec: 1.5
  recovery_sustain_sec: 1.5

alert:
  sound_dir: "assets/audio"
  warning_sound: "alert.wav"
  critical_sound: "alarm.wav"
  enabled: true

inference:
  backend: "onnx"
  face_model_path: "models/cpu_model/v8n_facedetect_model.onnx"
  distracted_model_path: "models/pt_model/v8m_distracted_detect_model.pt"
  confidence_threshold: 0.4
  device: "AUTO"
  crop_size: 320

pipeline:
  enabled_detectors:
    - ear
    - mar
    - head_pose
    - perclos
    - blink_rate
    - yolo_eye
  model_backend: "mediapipe"
  frame_skip: 0
  show_ui: true
  log_level: "INFO"
  profiling: false
  use_multiprocessing: true
